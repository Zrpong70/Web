<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>✦ VARDO LINKS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#231829;--s1:#2c1f34;--s2:#352540;--s3:#3d2b4a;
  --nl:#3f2f4c;--nd:#160f1c;--border:rgba(210,170,100,.10);
  --gold:#d2aa64;--gold2:#f0d090;--goldd:#7a5e20;--glow:rgba(210,170,100,.15);
  --rose:#b85870;--teal:#4a9e8e;--silver:#8a9eae;
  --text:#ede0cc;--sub:#7a6a58;
  --so:5px 5px 12px #160f1c,-3px -3px 8px #3f2f4c;
  --so2:3px 3px 7px #160f1c,-2px -2px 5px #3f2f4c;
  --si:inset 3px 3px 8px #160f1c,inset -2px -2px 6px #3f2f4c;
  --si2:inset 2px 2px 5px #160f1c,inset -1px -1px 4px #3f2f4c;
  --cw:124px;--ch:180px;
  --fd:'Cinzel Decorative',cursive;--fs:'Cinzel',serif;
  --fb:'Crimson Pro',serif;--fu:'Sarabun',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--fu);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;padding-bottom:100px;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
background:
  radial-gradient(1px 1px at 8% 15%,rgba(210,170,100,.6) 0%,transparent 100%),
  radial-gradient(1px 1px at 92% 8%,rgba(255,255,255,.25) 0%,transparent 100%),
  radial-gradient(1.5px 1.5px at 45% 25%,rgba(210,170,100,.4) 0%,transparent 100%),
  radial-gradient(1px 1px at 70% 60%,rgba(255,255,255,.2) 0%,transparent 100%),
  radial-gradient(1px 1px at 20% 70%,rgba(184,88,112,.4) 0%,transparent 100%),
  radial-gradient(1.5px 1.5px at 85% 40%,rgba(210,170,100,.35) 0%,transparent 100%),
  radial-gradient(1px 1px at 55% 85%,rgba(74,158,142,.4) 0%,transparent 100%),
  radial-gradient(1px 1px at 33% 50%,rgba(255,255,255,.15) 0%,transparent 100%);}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
background:radial-gradient(ellipse at 50% 50%,transparent 35%,rgba(14,8,18,.75) 100%);}
.wrap{position:relative;z-index:1;max-width:500px;margin:0 auto;padding:0 16px;}

/* STATUS BAR */
.statusbar{
  position:fixed;top:0;left:0;right:0;z-index:800;
  display:flex;align-items:center;justify-content:center;
  padding:8px 16px;
  font-family:var(--fs);font-size:10px;letter-spacing:2px;
  transition:all .3s;pointer-events:none;
}
.statusbar.online{color:var(--teal);text-shadow:0 0 8px rgba(74,158,142,.4);}
.statusbar.offline{color:var(--rose);text-shadow:0 0 8px rgba(184,88,112,.4);}
.statusbar.syncing{color:var(--gold);text-shadow:0 0 8px var(--glow);}
.sdot{width:6px;height:6px;border-radius:50%;margin-right:6px;display:inline-block;}
.online .sdot{background:var(--teal);box-shadow:0 0 6px rgba(74,158,142,.6);}
.offline .sdot{background:var(--rose);}
.syncing .sdot{background:var(--gold);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* HEADER */
.hdr{padding:44px 0 20px;text-align:center;}
.hcrown{font-size:16px;margin-bottom:6px;opacity:.55;letter-spacing:8px;}
.htitle{font-family:var(--fd);font-size:19px;font-weight:700;letter-spacing:4px;color:var(--gold);
text-shadow:0 0 30px var(--glow),0 0 60px rgba(210,170,100,.08);margin-bottom:4px;}
.hsub{font-family:var(--fb);font-style:italic;font-size:12px;color:var(--sub);}

/* LOADING */
#loadingEl{text-align:center;padding:60px 20px;}
.lorb{width:60px;height:60px;background:var(--s2);box-shadow:var(--so),0 0 20px var(--glow);
border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
font-size:26px;border:1px solid var(--border);animation:pulse 2s ease infinite;}
@keyframes pulse{0%,100%{box-shadow:var(--so),0 0 10px var(--glow);}50%{box-shadow:var(--so),0 0 25px rgba(210,170,100,.3);}}
.ltxt{font-family:var(--fs);font-size:11px;letter-spacing:3px;color:var(--sub);text-transform:uppercase;}

/* SEARCH */
.sw{margin-bottom:20px;position:relative;}
.sb{width:100%;background:var(--s1);box-shadow:var(--si);border:1px solid var(--border);
border-radius:50px;padding:12px 18px 12px 44px;font-family:var(--fu);font-size:14px;
color:var(--text);outline:none;transition:box-shadow .25s;}
.sb:focus{box-shadow:var(--si2),0 0 0 2px var(--glow);}
.sb::placeholder{color:var(--sub);}
.sico{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.4;pointer-events:none;}

/* NEW COL BTN */
.ncbtn{width:100%;background:var(--s1);box-shadow:var(--so);border:1px solid var(--border);
border-radius:14px;padding:14px;font-family:var(--fs);font-size:11px;font-weight:600;
letter-spacing:4px;color:var(--sub);cursor:pointer;margin-bottom:24px;
display:flex;align-items:center;justify-content:center;gap:10px;
transition:all .2s;text-transform:uppercase;}
.ncbtn:hover{color:var(--gold);border-color:rgba(210,170,100,.2);box-shadow:var(--so2),0 0 14px var(--glow);}
.ncbtn:active{box-shadow:var(--si2);}

/* COLLECTIONS */
.cols{display:flex;flex-direction:column;gap:28px;}
.col{animation:rUp .4s ease both;}
@keyframes rUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.cmeta{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:0 2px;}
.csigil{width:34px;height:34px;background:var(--s2);box-shadow:var(--si2);border-radius:50%;
display:flex;align-items:center;justify-content:center;font-size:15px;border:1px solid var(--border);flex-shrink:0;}
.cnames{flex:1;min-width:0;}
.cname{font-family:var(--fs);font-size:15px;font-weight:600;letter-spacing:.5px;color:var(--text);
background:none;border:none;outline:none;cursor:text;padding:2px 6px;border-radius:5px;
transition:background .15s;width:100%;}
.cname:focus{background:rgba(210,170,100,.06);}
.ccnt{font-size:10px;color:var(--sub);letter-spacing:2px;padding-left:6px;font-family:var(--fs);}
.cdelbtn{background:var(--s2);box-shadow:var(--so2);border:1px solid var(--border);border-radius:50%;
width:28px;height:28px;cursor:pointer;font-size:11px;color:var(--sub);
display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.cdelbtn:hover{color:var(--rose);border-color:rgba(184,88,112,.2);box-shadow:var(--si2);}

/* DECK */
.deck{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;}

/* CARD */
.cw{width:var(--cw);height:var(--ch);perspective:900px;flex-shrink:0;position:relative;}
.ci{width:100%;height:100%;position:relative;transform-style:preserve-3d;
transition:transform .6s cubic-bezier(.23,1,.32,1);border-radius:13px;}
.cw:hover .ci{transform:rotateY(180deg) translateY(-10px);}
.cf{position:absolute;inset:0;border-radius:13px;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.cback{background:var(--s1);box-shadow:var(--so);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.cbd{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(210,170,100,.04) 0deg,transparent 9deg,rgba(184,88,112,.04) 18deg,transparent 27deg);}
.cbf{position:absolute;inset:7px;border:1px solid rgba(210,170,100,.12);border-radius:8px;}
.cbf::after{content:'';position:absolute;inset:5px;border:1px solid rgba(210,170,100,.06);border-radius:5px;}
.cbs{position:relative;z-index:1;font-size:26px;filter:drop-shadow(0 0 8px rgba(210,170,100,.3));}
.cfront{background:var(--s1);box-shadow:var(--so);transform:rotateY(180deg);
display:flex;flex-direction:column;overflow:hidden;text-decoration:none;cursor:pointer;}
.ctop{height:28px;display:flex;align-items:center;justify-content:space-between;
padding:0 8px;flex-shrink:0;position:relative;}
.ctop::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
background:linear-gradient(90deg,transparent,rgba(210,170,100,.18),transparent);}
.crank{font-family:var(--fs);font-size:11px;font-weight:600;letter-spacing:1px;line-height:1;}
.csuite{font-size:9px;opacity:.55;}
.tg .crank,.tg .csuite,.tg .corn{color:var(--gold);}
.tg .ctop{background:linear-gradient(180deg,rgba(210,170,100,.06),transparent);}
.tr .crank,.tr .csuite,.tr .corn{color:var(--rose);}
.tr .ctop{background:linear-gradient(180deg,rgba(184,88,112,.06),transparent);}
.tt .crank,.tt .csuite,.tt .corn{color:var(--teal);}
.tt .ctop{background:linear-gradient(180deg,rgba(74,158,142,.06),transparent);}
.ts .crank,.ts .csuite,.ts .corn{color:var(--silver);}
.ts .ctop{background:linear-gradient(180deg,rgba(138,158,174,.06),transparent);}
.cbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:6px;padding:4px 7px;position:relative;}
.cbody::before{content:'';position:absolute;inset:4px;border-radius:7px;
background:radial-gradient(ellipse at 50% 30%,rgba(210,170,100,.04),transparent 70%);}
.cfav{width:36px;height:36px;border-radius:10px;background:var(--s2);box-shadow:var(--si2);
display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;
flex-shrink:0;border:1px solid var(--border);position:relative;z-index:1;}
.cfav img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
.ctitle{font-family:var(--fs);font-size:10px;font-weight:600;text-align:center;color:var(--text);
line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
overflow:hidden;word-break:break-word;position:relative;z-index:1;letter-spacing:.3px;}
.cdomain{font-family:var(--fb);font-style:italic;font-size:8.5px;color:var(--sub);
text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
width:100%;position:relative;z-index:1;}
.cbot{height:24px;display:flex;align-items:center;justify-content:center;
padding:0 8px;flex-shrink:0;position:relative;}
.cbot::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
background:linear-gradient(90deg,transparent,rgba(210,170,100,.18),transparent);}
.corn{font-size:9px;opacity:.4;letter-spacing:4px;font-family:var(--fs);}
.cdelx{position:absolute;top:4px;right:4px;width:19px;height:19px;border-radius:50%;
background:var(--s2);box-shadow:var(--so2);border:1px solid var(--border);
cursor:pointer;font-size:9px;color:var(--sub);display:none;
align-items:center;justify-content:center;z-index:10;transition:all .15s;}
.cw:hover .cdelx{display:flex;}
.cdelx:hover{background:var(--rose);color:#fff;border-color:var(--rose);box-shadow:none;}
.cadd{width:var(--cw);height:var(--ch);background:var(--s1);box-shadow:var(--so);
border-radius:13px;border:1px dashed rgba(210,170,100,.18);
display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:7px;cursor:pointer;color:var(--sub);transition:all .25s;flex-shrink:0;}
.cadd:hover{box-shadow:var(--so2),0 0 16px var(--glow);color:var(--gold);
border-color:rgba(210,170,100,.35);transform:translateY(-4px);}
.cadd:active{box-shadow:var(--si2);transform:scale(.97);}
.cadd .cp{font-size:20px;font-family:var(--fd);}
.cadd .cl{font-family:var(--fs);font-size:9px;letter-spacing:3px;text-transform:uppercase;}
.empty{text-align:center;padding:55px 20px;}
.esym{font-size:48px;margin-bottom:16px;filter:drop-shadow(0 0 16px rgba(210,170,100,.25));}
.etitle{font-family:var(--fd);font-size:15px;color:var(--gold);letter-spacing:2px;
margin-bottom:8px;text-shadow:0 0 20px var(--glow);}
.esub{font-family:var(--fb);font-style:italic;font-size:13px;color:var(--sub);}

/* OVERLAY */
.ov{position:fixed;inset:0;background:rgba(14,8,18,.78);backdrop-filter:blur(8px);
z-index:500;opacity:0;pointer-events:none;transition:opacity .3s;}
.ov.show{opacity:1;pointer-events:all;}
.sh{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-radius:26px 26px 0 0;
padding:14px 20px 50px;z-index:600;max-width:500px;margin:0 auto;
box-shadow:var(--so),0 -4px 30px rgba(0,0,0,.5);border-top:1px solid var(--border);
transform:translateY(100%);transition:transform .4s cubic-bezier(.32,.72,0,1);}
.ov.show .sh{transform:translateY(0);}
.shdrag{width:38px;height:3px;background:var(--sub);border-radius:2px;margin:0 auto 20px;opacity:.3;}
.shtitle{font-family:var(--fs);font-size:17px;font-weight:600;margin-bottom:18px;
letter-spacing:1px;color:var(--gold);display:flex;align-items:center;gap:8px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:10px;color:var(--sub);margin-bottom:6px;
letter-spacing:3px;text-transform:uppercase;font-family:var(--fs);}
.field input{width:100%;background:var(--s1);box-shadow:var(--si);border:1px solid var(--border);
border-radius:11px;padding:11px 15px;font-family:var(--fu);font-size:14px;
color:var(--text);outline:none;transition:box-shadow .2s;}
.field input:focus{box-shadow:var(--si2),0 0 0 2px var(--glow);}
.field input::placeholder{color:var(--sub);}
.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:14px;}
.sbtn{background:var(--s2);box-shadow:var(--so2);border:1px solid var(--border);
border-radius:10px;padding:9px 4px;font-size:18px;text-align:center;cursor:pointer;
transition:all .2s;line-height:1;}
.sbtn:hover{box-shadow:var(--so2),0 0 10px var(--glow);transform:translateY(-1px);}
.sbtn.sel{box-shadow:var(--si),0 0 10px var(--glow);border-color:rgba(210,170,100,.28);}
.trow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px;}
.tpick{background:var(--s2);box-shadow:var(--so2);border:1px solid var(--border);
border-radius:9px;padding:9px 4px;font-family:var(--fs);font-size:8.5px;letter-spacing:1px;
text-align:center;cursor:pointer;transition:all .2s;}
.tpick.sel{box-shadow:var(--si2);border-color:rgba(210,170,100,.25);}
.tpick .tsw{width:14px;height:14px;border-radius:50%;margin:0 auto 4px;}
.pv{display:flex;align-items:center;gap:10px;background:var(--s2);box-shadow:var(--si2);
border-radius:11px;padding:10px 13px;margin-bottom:13px;min-height:50px;border:1px solid var(--border);}
.pfav{width:30px;height:30px;border-radius:8px;background:var(--bg);box-shadow:var(--si2);
display:flex;align-items:center;justify-content:center;font-size:15px;
flex-shrink:0;overflow:hidden;border:1px solid var(--border);}
.pfav img{width:100%;height:100%;object-fit:cover;border-radius:6px;}
.ptitle{font-family:var(--fs);font-size:12px;font-weight:600;color:var(--text);}
.pdomain{font-family:var(--fb);font-style:italic;font-size:11px;color:var(--sub);}
.acts{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:6px;}
.bcx{padding:13px;background:var(--s2);box-shadow:var(--so2);border:1px solid var(--border);
border-radius:12px;font-family:var(--fs);font-size:11px;letter-spacing:2px;
color:var(--sub);cursor:pointer;transition:all .15s;text-transform:uppercase;}
.bcx:active{box-shadow:var(--si2);}
.bco{padding:13px;background:var(--s2);
box-shadow:var(--so2),0 0 0 1px var(--goldd);border:none;border-radius:12px;
font-family:var(--fs);font-size:11px;letter-spacing:2px;color:var(--gold);
cursor:pointer;text-transform:uppercase;text-shadow:0 0 10px var(--glow);transition:all .15s;}
.bco:hover{box-shadow:var(--so2),0 0 16px var(--glow),0 0 0 1px var(--goldd);}
.bco:active{box-shadow:var(--si2);}
.toast{position:fixed;bottom:26px;left:50%;
transform:translateX(-50%) translateY(80px);
background:var(--s2);box-shadow:var(--so),0 0 16px rgba(210,170,100,.12);
color:var(--gold);font-family:var(--fs);font-size:11px;letter-spacing:2px;
padding:10px 22px;border-radius:50px;z-index:9000;
transition:transform .35s cubic-bezier(.32,.72,0,1);
white-space:nowrap;border:1px solid var(--border);text-shadow:0 0 10px var(--glow);}
.toast.show{transform:translateX(-50%) translateY(0);}
.sp{width:14px;height:14px;border:1.5px solid var(--s2);border-top-color:var(--gold);
border-radius:50%;animation:sp .6s linear infinite;display:inline-block;}
@keyframes sp{to{transform:rotate(360deg);}}
.col.hidden,.cw.hidden{display:none;}
</style>
</head>
<body>

<!-- STATUS BAR -->
<div class="statusbar syncing" id="statusBar">
  <span class="sdot"></span>
  <span id="statusTxt">CONNECTING…</span>
</div>

<div class="wrap">
  <div class="hdr">
    <div class="hcrown">✦ &nbsp; ✧ &nbsp; ✦</div>
    <div class="htitle">VARDO LINKS</div>
    <div class="hsub">shared collection · real-time sync</div>
  </div>

  <div id="loadingEl">
    <div class="lorb">🔮</div>
    <div class="ltxt">Consulting the cards…</div>
  </div>

  <div id="mainEl" style="display:none">
    <div class="sw">
      <span class="sico">✦</span>
      <input class="sb" type="text" placeholder="Seek your links…" oninput="doSearch(this.value)">
    </div>
    <button class="ncbtn" onclick="openNewCol()">⬡ &nbsp; New Collection</button>
    <div class="cols" id="CL"></div>
  </div>
</div>

<div class="ov" id="OV" onclick="closeSheet()">
  <div class="sh" onclick="event.stopPropagation()">
    <div class="shdrag"></div>
    <div id="SC"></div>
  </div>
</div>
<div class="toast" id="TOAST"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ── Firebase config ──
const firebaseConfig = {
  apiKey: "AIzaSyBnU7fXQajjDrroyOph0ktC7s4PS8Azi5w",
  authDomain: "vardo-2e821.firebaseapp.com",
  projectId: "vardo-2e821",
  storageBucket: "vardo-2e821.firebasestorage.app",
  messagingSenderId: "846632677695",
  appId: "1:846632677695:web:d35f49153207a241a2638a"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const REF = doc(db, "vardo", "shared");

// ── constants ──
const SIGILS=['✦','⚜','☽','⬡','◈','✺','⚘','♾','⚡','✧'];
const THEMES=[
  {n:'GOLD',c:'tg',hex:'#d2aa64'},
  {n:'ROSE',c:'tr',hex:'#b85870'},
  {n:'TEAL',c:'tt',hex:'#4a9e8e'},
  {n:'SILVER',c:'ts',hex:'#8a9eae'},
];
const RNKS=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII'];
let SS=SIGILS[0], ST=THEMES[0];
let _cache = {collections:[]};

// ── status ──
function setStatus(s){
  const bar=document.getElementById('statusBar');
  const txt=document.getElementById('statusTxt');
  bar.className='statusbar '+s;
  txt.textContent=s==='online'?'SYNCED':s==='offline'?'OFFLINE':'SYNCING…';
}

// ── helpers ──
function gid(){return Date.now()+Math.random().toString(36).slice(2,6);}
function dom(u){try{return new URL(u).hostname.replace('www.','')}catch{return u;}}
function fav(u){try{return`https://www.google.com/s2/favicons?domain=${new URL(u).origin}&sz=64`}catch{return null;}}

// ── save to Firebase ──
async function saveData(d){
  setStatus('syncing');
  try{
    await setDoc(REF, {data: JSON.stringify(d)});
    _cache=d;
    setStatus('online');
  }catch(e){
    console.error(e);
    setStatus('offline');
    showToast('⚠ Save failed — check connection');
  }
}

// ── real-time listener ──
function startListener(){
  onSnapshot(REF, (snap)=>{
    document.getElementById('loadingEl').style.display='none';
    document.getElementById('mainEl').style.display='block';
    setStatus('online');
    if(snap.exists()){
      try{
        _cache = JSON.parse(snap.data().data);
      }catch{ _cache={collections:[]}; }
    } else {
      _cache={collections:[]};
    }
    renderWith(_cache);
  }, (err)=>{
    console.error(err);
    setStatus('offline');
    document.getElementById('loadingEl').style.display='none';
    document.getElementById('mainEl').style.display='block';
    showToast('⚠ Cannot connect to Firebase');
  });
}

// ── render ──
function renderWith(d){
  const el=document.getElementById('CL');
  if(!d.collections||!d.collections.length){
    el.innerHTML=`<div class="empty">
      <div class="esym">🔮</div>
      <div class="etitle">The cards await</div>
      <div class="esub">สร้าง collection แรกได้เลยครับ</div>
    </div>`;return;
  }
  el.innerHTML='';
  d.collections.forEach((col,ci)=>{
    const ce=document.createElement('div');
    ce.className='col'; ce.dataset.ci=ci;
    ce.style.animationDelay=(ci*.06)+'s';
    const cards=col.links.map((lk,li)=>{
      const r=RNKS[li%RNKS.length],f=fav(lk.url),dv=dom(lk.url);
      return`<div class="cw" data-ci="${ci}" data-li="${li}"
        data-title="${(lk.title||'').toLowerCase()}"
        data-domain="${dv.toLowerCase()}">
        <div class="ci">
          <div class="cf cback">
            <div class="cbd"></div><div class="cbf"></div>
            <div class="cbs">${col.sigil||'✦'}</div>
          </div>
          <a class="cf cfront ${col.theme||'tg'}"
            href="${lk.url}" target="_blank" rel="noopener"
            onclick="event.stopPropagation()">
            <button class="cdelx"
              onclick="event.preventDefault();event.stopPropagation();window._delLink(${ci},${li})">✕</button>
            <div class="ctop">
              <span class="crank">${r}</span>
              <span class="csuite">${col.sigil||'✦'}</span>
            </div>
            <div class="cbody">
              <div class="cfav">${f?`<img src="${f}" onerror="this.parentElement.textContent='✦'">`:'✦'}</div>
              <div class="ctitle">${lk.title||dv}</div>
              <div class="cdomain">${dv}</div>
            </div>
            <div class="cbot"><div class="corn">· · ·</div></div>
          </a>
        </div>
      </div>`;
    }).join('');
    ce.innerHTML=`
      <div class="cmeta">
        <div class="csigil">${col.sigil||'✦'}</div>
        <div class="cnames">
          <div class="cname" contenteditable="true" spellcheck="false"
            onblur="window._renameCol(${ci},this.textContent.trim())"
            onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
          >${col.name}</div>
          <div class="ccnt">${col.links.length} CARDS</div>
        </div>
        <button class="cdelbtn" onclick="window._delCol(${ci})">✕</button>
      </div>
      <div class="deck">${cards}
        <button class="cadd" onclick="window._openAdd(${ci})">
          <div class="cp">+</div><div class="cl">Add Card</div>
        </button>
      </div>`;
    el.appendChild(ce);
  });
}

// ── search ──
window.doSearch=function(q){
  q=q.toLowerCase().trim();
  document.querySelectorAll('.col').forEach(ce=>{
    let v=false;
    ce.querySelectorAll('.cw').forEach(c=>{
      const m=!q||c.dataset.title?.includes(q)||c.dataset.domain?.includes(q);
      c.classList.toggle('hidden',!m);if(m)v=true;
    });
    ce.classList.toggle('hidden',q&&!v);
  });
};

// ── sheet ──
window.openSheet=function(){document.getElementById('OV').classList.add('show');};
window.closeSheet=function(){document.getElementById('OV').classList.remove('show');};

// ── new collection ──
window.openNewCol=function(){
  SS=SIGILS[0];ST=THEMES[0];
  document.getElementById('SC').innerHTML=`
    <div class="shtitle">✦ New Collection</div>
    <div class="field"><label>Name</label>
      <input type="text" id="CN" placeholder="Work, Travel, Mystical…"></div>
    <div class="field"><label>Sigil</label></div>
    <div class="sgrid">${SIGILS.map(s=>`<button class="sbtn${s===SS?' sel':''}" onclick="window._pickS('${s}',this)">${s}</button>`).join('')}</div>
    <div class="field"><label>Theme</label></div>
    <div class="trow">${THEMES.map((t,i)=>`<div class="tpick${i===0?' sel':''}" onclick="window._pickT(${i},this)">
      <div class="tsw" style="background:${t.hex}"></div>
      <span style="color:${t.hex}">${t.n}</span></div>`).join('')}</div>
    <div class="acts">
      <button class="bcx" onclick="closeSheet()">Cancel</button>
      <button class="bco" onclick="window._confNewCol()">✦ Conjure</button>
    </div>`;
  openSheet();
  setTimeout(()=>document.getElementById('CN')?.focus(),150);
};
window._pickS=function(s,el){SS=s;document.querySelectorAll('.sbtn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');};
window._pickT=function(i,el){ST=THEMES[i];document.querySelectorAll('.tpick').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');};
window._confNewCol=async function(){
  const n=document.getElementById('CN').value.trim();
  if(!n){showToast('ใส่ชื่อก่อนนะ ✦');return;}
  const d=JSON.parse(JSON.stringify(_cache));
  d.collections.push({id:gid(),name:n,sigil:SS,theme:ST.c,links:[]});
  await saveData(d); closeSheet(); showToast('✦ Collection conjured');
};

// ── add link ──
window._openAdd=function(ci){
  window._addCi=ci;
  document.getElementById('SC').innerHTML=`
    <div class="shtitle">✦ Add a Card</div>
    <div class="field"><label>URL</label>
      <input type="url" id="LU" placeholder="https://…" oninput="window._pvUrl(this.value)"></div>
    <div id="PV" style="display:none" class="pv"><div class="sp"></div></div>
    <div class="field"><label>Title (optional)</label>
      <input type="text" id="LT" placeholder="ดึงอัตโนมัติจาก domain"></div>
    <div class="acts">
      <button class="bcx" onclick="closeSheet()">Cancel</button>
      <button class="bco" onclick="window._confAdd()">✦ Reveal</button>
    </div>`;
  openSheet();
  setTimeout(()=>document.getElementById('LU')?.focus(),150);
};

let _pt;
window._pvUrl=function(v){
  clearTimeout(_pt);
  const pv=document.getElementById('PV');
  if(!v||!v.includes('.')){pv.style.display='none';return;}
  pv.style.display='flex';
  pv.innerHTML=`<div class="sp"></div><div style="font-size:12px;color:var(--sub);margin-left:10px;font-family:var(--fb);font-style:italic">Reading the signs…</div>`;
  _pt=setTimeout(()=>{
    let u=v.startsWith('http')?v:'https://'+v;
    const dv=dom(u),f=fav(u);
    pv.innerHTML=`<div class="pfav">${f?`<img src="${f}" onerror="this.parentElement.textContent='✦'">`:'✦'}</div>
    <div><div class="ptitle">${document.getElementById('LT')?.value||dv}</div>
    <div class="pdomain">${dv}</div></div>`;
  },700);
};

window._confAdd=async function(){
  const ci=window._addCi;
  let u=(document.getElementById('LU')?.value||'').trim();
  if(!u){showToast('ใส่ URL ก่อนนะ');return;}
  if(!u.startsWith('http'))u='https://'+u;
  try{new URL(u);}catch{showToast('URL ไม่ถูกต้อง');return;}
  const t=document.getElementById('LT')?.value.trim()||dom(u);
  const d=JSON.parse(JSON.stringify(_cache));
  d.collections[ci].links.push({id:gid(),url:u,title:t});
  await saveData(d); closeSheet(); showToast('✦ Card revealed');
};

window._renameCol=async function(ci,n){
  const d=JSON.parse(JSON.stringify(_cache));
  if(!n||n===d.collections[ci].name)return;
  d.collections[ci].name=n; await saveData(d);
};
window._delCol=async function(ci){
  const d=JSON.parse(JSON.stringify(_cache));
  if(!confirm(`ลบ "${d.collections[ci].name}"?`))return;
  d.collections.splice(ci,1); await saveData(d); showToast('Collection dissolved');
};
window._delLink=async function(ci,li){
  const d=JSON.parse(JSON.stringify(_cache));
  d.collections[ci].links.splice(li,1);
  await saveData(d); showToast('Card removed');
};

function showToast(m){
  const el=document.getElementById('TOAST');
  el.textContent=m;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400);
}
window.showToast=showToast;

// ── start ──
startListener();
</script>
</body>
</html>
